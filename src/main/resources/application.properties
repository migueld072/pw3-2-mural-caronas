spring.application.name=mural_caronas

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=mural_caronas;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=*123456HAS*

